name: Bug
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Don't file it here: see SECURITY.md. Please leave out any real names, documents or other personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Commands, settings (no secrets) and the files involved, if you can share invented ones.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit of agent-core you are running, if you know it.
